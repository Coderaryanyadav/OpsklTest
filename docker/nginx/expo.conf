server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container readiness endpoint. It proves nginx can serve the exported app.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Expo's hashed static bundle can be cached aggressively.
    location /_expo/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static Expo Router exports exist as /route.html. Support clean URLs and
    # fall back to the client-side router shell for unmatched routes.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
