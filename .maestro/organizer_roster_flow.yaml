appId: com.opskil.organizer
name: Organizer Shift Creation and Live Crew Check-In Flow
---
# 1. Launch Organizer App
- launchApp:
    clearState: true

# 2. Organizer Dashboard Overview
- assertVisible: "OPSKL ORGANIZER"
- assertVisible: "+ Post Shift"
- assertVisible: "Active Jobs"

# 3. Post a New Shift Wizard Flow
- tapOn: "+ Post Shift"
- assertVisible: "Role & Category"
- tapOn: "Conference"
- tapOn: "Next →"

# 4. Fill Headcount and Shift Schedule
- assertVisible: "Headcount Requirement"
- tapOn: "Next →"

# 5. Review Live Roster & Applicants
- tapOn: "Roster"
- assertVisible: "Crew Roster & Selection"

# 6. Live Shift Console & Venue Check-In
- tapOn: "Overview"
- assertVisible: "Live Event Shifts"
